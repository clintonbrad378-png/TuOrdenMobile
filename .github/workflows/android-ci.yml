name: Android CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-android:
    name: Build Android (debug)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018'

      - name: Export Android NDK env
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          NDK_DIR="$SDK_ROOT/ndk/27.2.12479018"
          if [ ! -d "$NDK_DIR" ]; then
            NDK_DIR=$(ls -d "$SDK_ROOT"/ndk/* 2>/dev/null | sort -V | tail -n1)
          fi
          echo "NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "NDK: $NDK_DIR"
          LLVM_BIN="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "$LLVM_BIN" >> $GITHUB_PATH
          echo "CC_aarch64-linux-android=$LLVM_BIN/aarch64-linux-android21-clang" >> $GITHUB_ENV
          echo "CC_aarch64_linux_android=$LLVM_BIN/aarch64-linux-android21-clang" >> $GITHUB_ENV
          echo "CC_armv7-linux-androideabi=$LLVM_BIN/armv7a-linux-androideabi21-clang" >> $GITHUB_ENV
          echo "CC_armv7_linux_androideabi=$LLVM_BIN/armv7a-linux-androideabi21-clang" >> $GITHUB_ENV
          echo "CC_i686-linux-android=$LLVM_BIN/i686-linux-android21-clang" >> $GITHUB_ENV
          echo "CC_i686_linux_android=$LLVM_BIN/i686-linux-android21-clang" >> $GITHUB_ENV
          echo "CC_x86_64-linux-android=$LLVM_BIN/x86_64-linux-android21-clang" >> $GITHUB_ENV
          echo "CC_x86_64_linux_android=$LLVM_BIN/x86_64-linux-android21-clang" >> $GITHUB_ENV
          ls "$LLVM_BIN" | grep -E "21-clang$" || true

      - name: Configure Cargo for Android
        run: |
          mkdir -p src-tauri/.cargo
          cat > src-tauri/.cargo/config.toml << 'EOF'
          [target.aarch64-linux-android]
          linker = "aarch64-linux-android21-clang"

          [target.armv7-linux-androideabi]
          linker = "armv7a-linux-androideabi21-clang"

          [target.i686-linux-android]
          linker = "i686-linux-android21-clang"

          [target.x86_64-linux-android]
          linker = "x86_64-linux-android21-clang"
          EOF

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked

      - name: Build Android APK (debug)
        run: |
          cd src-tauri
          cargo tauri android build --target aarch64-linux-android --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tauri-android-debug-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7