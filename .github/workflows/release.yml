name: Release Android

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 33
          ndk-version: '27'

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses

      - name: Install Rust targets for Android
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Install cargo-tauri
        run: cargo install tauri-cli --version "^2" --locked

      - name: Initialize Tauri Android project
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          cd src-tauri
          cargo tauri android init

      - name: Build Tauri Android app (release)
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          cd src-tauri
          cargo tauri android build

      - name: Sign APKs
        env:
          KEYS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          APP_VERSION: ${{ github.ref_name }}
        run: |
          set -e
          echo "$KEYS_B64" | base64 -d > /tmp/keystore.jks
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          echo "Build-tools: $BT"
          VER="${APP_VERSION#v}"
          OUT=src-tauri/gen/android/app/build/outputs/apk
          find "$OUT" -name '*.apk' -type f | while read -r apk; do
            flavor=$(basename "$(dirname "$apk")")
            aligned="/tmp/$(basename "$apk").aligned"
            "$BT/zipalign" -f -p 4 "$apk" "$aligned"
            "$BT/apksigner" sign \
              --ks /tmp/keystore.jks \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$KS_PASS" \
              --key-pass "pass:$KS_PASS" \
              --out "$apk" "$aligned"
            rm -f "$aligned"
            "$BT/apksigner" verify "$apk"
            mv "$apk" "$(dirname "$apk")/TuOrden-${VER}-${flavor}.apk"
            echo "Firmado y renombrado: TuOrden-${VER}-${flavor}.apk"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tuorden-android-apks
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          generate_release_notes: true
          body: |
            ## TuOrden Mobile ${{ github.ref_name }}

            APK de Android firmado, listo para instalar.

            - `TuOrden-*universal*.apk` — recomendado para la mayoría de dispositivos
            - Los demás son por arquitectura (arm64-v8a, armeabi-v7a, x86_64)
