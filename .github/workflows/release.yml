name: Release Android

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018'

      - name: Export Android NDK env
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          NDK_DIR="$SDK_ROOT/ndk/27.2.12479018"
          if [ ! -d "$NDK_DIR" ]; then
            NDK_DIR=$(ls -d "$SDK_ROOT"/ndk/* 2>/dev/null | sort -V | tail -n1)
          fi
          echo "NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "NDK: $NDK_DIR"
          LLVM_BIN="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "$LLVM_BIN" >> $GITHUB_PATH
          echo "CC_aarch64-linux-android=$LLVM_BIN/aarch64-linux-android21-clang" >> $GITHUB_ENV
          echo "CC_aarch64_linux_android=$LLVM_BIN/aarch64-linux-android21-clang" >> $GITHUB_ENV
          echo "CC_armv7-linux-androideabi=$LLVM_BIN/armv7a-linux-androideabi21-clang" >> $GITHUB_ENV
          echo "CC_armv7_linux_androideabi=$LLVM_BIN/armv7a-linux-androideabi21-clang" >> $GITHUB_ENV
          echo "CC_i686-linux-android=$LLVM_BIN/i686-linux-android21-clang" >> $GITHUB_ENV
          echo "CC_i686_linux_android=$LLVM_BIN/i686-linux-android21-clang" >> $GITHUB_ENV
          echo "CC_x86_64-linux-android=$LLVM_BIN/x86_64-linux-android21-clang" >> $GITHUB_ENV
          echo "CC_x86_64_linux_android=$LLVM_BIN/x86_64-linux-android21-clang" >> $GITHUB_ENV
          ls "$LLVM_BIN" | grep -E "21-clang$" || true

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses

      - name: Install Rust targets for Android
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Install cargo-tauri
        run: cargo install tauri-cli --version "^2" --locked

      - name: Initialize Tauri Android project
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          cd src-tauri
          cargo tauri android init

      - name: Build Tauri Android app (release)
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          cd src-tauri
          cargo tauri android build

      - name: Sign APKs
        env:
          KEYS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          APP_VERSION: ${{ github.ref_name }}
        run: |
          set -e
          echo "$KEYS_B64" | base64 -d > /tmp/keystore.jks
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          echo "Build-tools: $BT"
          VER="${APP_VERSION#v}"
          OUT=src-tauri/gen/android/app/build/outputs/apk
          find "$OUT" -name '*.apk' -type f | while read -r apk; do
            flavor=$(basename "$(dirname "$apk")")
            aligned="/tmp/$(basename "$apk").aligned"
            "$BT/zipalign" -f -p 4 "$apk" "$aligned"
            "$BT/apksigner" sign \
              --ks /tmp/keystore.jks \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$KS_PASS" \
              --key-pass "pass:$KS_PASS" \
              --out "$apk" "$aligned"
            rm -f "$aligned"
            "$BT/apksigner" verify "$apk"
            mv "$apk" "$(dirname "$apk")/TuOrden-${VER}-${flavor}.apk"
            echo "Firmado y renombrado: TuOrden-${VER}-${flavor}.apk"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tuorden-android-apks
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          generate_release_notes: true
          body: |
            ## TuOrden Mobile ${{ github.ref_name }}

            APK de Android firmado, listo para instalar.

            - `TuOrden-*universal*.apk` — recomendado para la mayoría de dispositivos
            - Los demás son por arquitectura (arm64-v8a, armeabi-v7a, x86_64)
