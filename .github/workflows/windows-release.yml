name: Release Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  TARGET: x86_64-pc-windows-msvc

jobs:
  windows-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Read app version
        id: version
        shell: pwsh
        run: |
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          "app_version=$($conf.version)" >> $env:GITHUB_OUTPUT
          Write-Host "Version de la app: $($conf.version)"

      - name: Build TuOrden (release, NSIS + MSI)
        env:
          CARGO_BUILD_TARGET: ${{ env.TARGET }}
        run: npm run tauri build -- --target $env:TARGET

      - name: Collect installers
        shell: pwsh
        run: |
          $bundle = "src-tauri/target/$env:TARGET/release/bundle"
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Copy-Item "$bundle/nsis/*.exe" staging -ErrorAction SilentlyContinue
          Copy-Item "$bundle/msi/*.msi" staging -ErrorAction SilentlyContinue
          if (-not (Get-ChildItem staging -ErrorAction SilentlyContinue)) {
            throw "No se generaron instaladores en $bundle"
          }
          Get-ChildItem staging | Select-Object Name, Length | Format-Table -AutoSize

      - name: Check code-signing secrets
        shell: pwsh
        run: |
          $has = -not [string]::IsNullOrWhiteSpace('${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}')
          "HAS_CERT=$(if ($has) { 'true' } else { 'false' })" >> $env:GITHUB_ENV
          Write-Host "Firma de codigo: $(if ($has) { 'habilitada' } else { 'omitida (sin certificado en secrets)' })"

      - name: Sign installers (optional)
        if: env.HAS_CERT == 'true'
        shell: pwsh
        env:
          WIN_CERT_B64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WIN_CERT_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP "windows-signing.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WIN_CERT_B64))
          $sdkRoot = "C:\Program Files (x86)\Windows Kits\10\bin"
          $sdk = Get-ChildItem $sdkRoot -Directory |
            Where-Object { $_.Name -match '^\d+\.' } |
            Sort-Object Name -Descending |
            Select-Object -First 1
          $signtool = Join-Path $sdk.FullName "x64\signtool.exe"
          if (-not (Test-Path $signtool)) { throw "signtool no encontrado en $sdkRoot" }
          Get-ChildItem staging | ForEach-Object {
            & $signtool sign `
              /f $certPath /p $env:WIN_CERT_PASSWORD /fd SHA256 `
              /tr http://timestamp.digicert.com /td SHA256 $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Fallo al firmar $($_.Name)" }
            & $signtool verify /pa /all $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Fallo al verificar firma de $($_.Name)" }
          }
          Remove-Item $certPath -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tuorden-windows-${{ steps.version.outputs.app_version }}-x64
          path: staging/*
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: staging/*
          generate_release_notes: true
          body: |
            ## TuOrden ${{ github.ref_name }} para Windows

            - `*_setup.exe` (NSIS) — instalador recomendado, permite instalacion por usuario o por maquina
            - `*.msi` (WiX) — para despliegue corporativo (GPO/Intune)

            ### Compatibilidad
            - Windows 10 / 11 x64
            - WebView2 Runtime incluido en el instalador (no requiere instalacion previa)
            - HiDPI soportado automaticamente (escalado por DPI de Windows)
