name: Build Tauri Android App

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 33
          ndk-version: '27'

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses

      - name: Install Rust target for Android
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Install cargo-tauri
        run: cargo install tauri-cli --version "^2" --locked

      - name: Initialize Tauri Android project
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          cd src-tauri
          cargo tauri android init

      - name: Build Tauri Android app (release)
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          cd src-tauri
          cargo tauri android build -- --release

      - name: Upload Android APK/AAB
        uses: actions/upload-artifact@v4
        with:
          name: tuorden-android
          path: src-tauri/gen/android/app/build/outputs/apk/release/
          if-no-matches: ignore